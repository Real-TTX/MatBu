name: matbu-remote-secondary

services:
  secondary:
    image: ghcr.io/real-ttx/matbu:dev
    pull_policy: always
    restart: unless-stopped
    environment:
      MATBU_DATA_PATH: /data
      MATBU_INSTANCE_ROLE: Secondary
      MATBU_PRIMARY_ENDPOINT: "https://backup.example.de"
      MATBU_INSTANCE_TOKEN: "HIER-TOKEN-EINTRAGEN"
    volumes:
      - matbu-remote-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9293/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  matbu-remote-data:
