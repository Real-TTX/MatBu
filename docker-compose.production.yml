name: matbu

services:
  matbu:
    image: ghcr.io/real-ttx/matbu:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "9293:9293"
    environment:
      MATBU_ALL_IN_ONE: "true"
    volumes:
      - matbu-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9293/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  matbu-data:
